services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: bilanco
      POSTGRES_USER: bilanco
      POSTGRES_PASSWORD: ${BILANCO_DB_PASSWORD:?Set BILANCO_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - bilanco_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bilanco -d bilanco"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  bilanco_postgres:
